<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Vishal Naveen</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,300..800&family=JetBrains+Mono:wght@400..500&display=swap">
  <style>
    :root { --text: #f3efeb; --text-2: #a8a19b; --text-3: #79726c; --ember: #ff5a1f; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; }
    body {
      display: grid; place-items: center; padding: 24px; overflow: hidden;
      color: var(--text); font-family: 'Mona Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    }
    main { max-width: 680px; text-align: left; }
    .path { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: var(--text-3); margin-bottom: 14px; }
    h1 { font-weight: 600; font-size: clamp(96px, 26vw, 240px); line-height: 0.9; letter-spacing: -0.06em; color: var(--text); }
    p.msg { margin: 22px 0 30px; max-width: 42ch; font-size: 18px; line-height: 1.55; color: var(--text-2); }
    a.btn {
      display: inline-flex; align-items: center; height: 46px; padding: 0 22px; border-radius: 999px;
      color: #000; font-weight: 550; font-size: 15px; text-decoration: none; background: var(--ember);
      transition: background 0.25s;
    }
    a.btn:hover { background: #ff6d36; }
    a.btn:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { a.btn { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="path">GET /this-page: 404</p>
    <h1 id="n">404</h1>
    <p class="msg">That page doesn't exist. The arm, the projects and the contact details are all on the home page.</p>
    <a class="btn" href="/">Back to the home page</a>
  </main>
  
</body>
</html>
